<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雲端心電感應 ✦ Telepathy Game</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Zen Maru Gothic & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FFFDF9',
              100: '#FAF6F0',
              200: '#F5EBE6',
              300: '#E8D8CE',
              400: '#D6C0B3',
              500: '#AB9384',
              700: '#7A6253',
              800: '#534135',
            },
            accent: {
              warm: '#E68369',
              soft: '#F3D0D7',
              lavender: '#A084E8',
              matcha: '#A3B799',
            }
          },
          fontFamily: {
            rounded: ['"Zen Maru Gothic"', 'sans-serif'],
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FAF6F0;
      color: #534135;
      font-family: 'Noto Sans TC', sans-serif;
    }
    
    /* 3D Card Flip CSS */
    .perspective-1000 {
      perspective: 1000px;
    }
    
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    
    .card-flipped .card-inner {
      transform: rotateY(180deg);
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .card-front {
      background-color: #E8D8CE;
      color: #7A6253;
    }
    
    .card-back {
      background-color: #FFFDF9;
      color: #534135;
      transform: rotateY(180deg);
      border: 2px solid #E8D8CE;
    }

    /* Custom Toast Notification */
    #toast {
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accent-soft selection:text-cream-800">

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transform -translate-y-20 opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-cream-800 text-cream-50 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-medium">
      <i id="toast-icon" data-lucide="info" class="w-4 h-4 text-accent-soft"></i>
      <span id="toast-message">提示訊息</span>
    </div>
  </div>

  <!-- Header Section -->
  <header class="w-full max-w-4xl mx-auto px-4 pt-6 pb-2 flex justify-between items-center">
    <div class="flex items-center space-x-2 cursor-pointer" onclick="goHome()">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-accent-warm to-accent-soft flex items-center justify-center text-white shadow-md">
        <i data-lucide="sparkles" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="font-rounded font-bold text-xl tracking-wide text-cream-800 flex items-center gap-1.5">
          雲端心電感應 <span class="text-xs bg-accent-soft text-cream-800 font-normal px-2 py-0.5 rounded-full">ins style</span>
        </h1>
        <p class="text-xs text-cream-500">多人默契考驗 ✦ 同步開牌</p>
      </div>
    </div>

    <!-- Right Top Header Actions & Secret Host Trigger -->
    <div class="flex items-center space-x-2">
      <!-- Active Room Pill -->
      <div id="header-room-info" class="hidden bg-cream-200 border border-cream-300 px-3 py-1.5 rounded-xl text-xs font-medium text-cream-700 flex items-center gap-2">
        <span>房號: <strong id="header-room-code" class="text-cream-800 font-bold">----</strong></span>
        <button onclick="copyShareLink()" class="hover:text-accent-warm transition-colors" title="複製房間連結">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Secret Host Toggle Switch -->
      <button id="secret-host-toggle" onclick="toggleHostConsole()" title="切換房主模式" 
              class="w-9 h-9 rounded-xl bg-cream-200 hover:bg-cream-300 text-cream-700 flex items-center justify-center transition-all shadow-sm">
        <i data-lucide="crown" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-3xl mx-auto px-4 py-4 flex-1 flex flex-col justify-center">

    <!-- STEP 1: LOGIN / ROOM JOIN & CREATE VIEW -->
    <section id="view-login" class="space-y-6">
      <div class="bg-cream-50 border border-cream-200 rounded-3xl p-6 md:p-8 shadow-lg shadow-cream-200/50 text-center max-w-md mx-auto">
        <div class="w-16 h-16 bg-cream-200 rounded-full flex items-center justify-center mx-auto mb-4 text-cream-700">
          <i data-lucide="heart-handshake" class="w-8 h-8"></i>
        </div>
        <h2 class="font-rounded font-bold text-2xl text-cream-800 mb-1">加入心電感應</h2>
        <p class="text-sm text-cream-500 mb-6">輸入暱稱與房間號碼，測試你跟夥伴的默契吧！</p>

        <div class="space-y-4 text-left">
          <div>
            <label class="block text-xs font-semibold text-cream-700 mb-1.5 ml-1">玩家暱稱</label>
            <input type="text" id="input-player-name" placeholder="例如：奶油小熊" 
                   class="w-full px-4 py-3 rounded-2xl bg-cream-100 border border-cream-300 focus:outline-none focus:ring-2 focus:ring-accent-warm/50 text-cream-800 placeholder-cream-400 font-medium text-sm transition-all">
          </div>

          <div>
            <label class="block text-xs font-semibold text-cream-700 mb-1.5 ml-1">房間代碼 (4位數字/英文)</label>
            <div class="flex space-x-2">
              <input type="text" id="input-room-code" placeholder="如：8888" maxlength="10"
                     class="w-full px-4 py-3 rounded-2xl bg-cream-100 border border-cream-300 focus:outline-none focus:ring-2 focus:ring-accent-warm/50 text-cream-800 placeholder-cream-400 font-medium text-sm uppercase tracking-wider transition-all">
              <button onclick="generateRandomRoom()" class="px-3 bg-cream-200 hover:bg-cream-300 rounded-2xl text-cream-700 text-xs font-semibold whitespace-nowrap transition-colors flex items-center gap-1">
                <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> 隨機
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button onclick="joinGame()" class="w-full bg-gradient-to-r from-cream-700 to-cream-800 hover:from-cream-800 hover:to-cream-700 text-cream-50 font-bold py-3.5 px-6 rounded-2xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center space-x-2">
              <span>進入遊戲房間</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- STEP 2: GAMEPLAY & MAIN ROOM VIEW -->
    <section id="view-game" class="hidden space-y-6">

      <!-- Host Control Panel Overlay (Toggled by Secret Button) -->
      <div id="host-console" class="hidden bg-cream-800 text-cream-50 rounded-3xl p-6 shadow-2xl space-y-4 border border-cream-700 transition-all">
        <div class="flex justify-between items-center border-b border-cream-700 pb-3">
          <div class="flex items-center space-x-2">
            <i data-lucide="crown" class="w-5 h-5 text-accent-warm"></i>
            <h3 class="font-rounded font-bold text-lg text-cream-100">隱藏房主控制台</h3>
          </div>
          <span class="text-xs bg-cream-700 px-2.5 py-1 rounded-full text-cream-300">房主權限 Mode</span>
        </div>

        <!-- Host Actions -->
        <div class="space-y-4">
          <div>
            <label class="block text-xs text-cream-300 mb-1.5">設定全新出題內容：</label>
            <div class="flex flex-col sm:flex-row gap-2">
              <input type="text" id="host-question-input" placeholder="例如：提到夏天會聯想到的水果？" 
                     class="flex-1 px-4 py-2.5 rounded-xl bg-cream-700 border border-cream-600 text-cream-50 placeholder-cream-400 text-sm focus:outline-none focus:ring-2 focus:ring-accent-warm">
              <button onclick="hostSetQuestion()" class="bg-accent-warm hover:bg-orange-600 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition-colors whitespace-nowrap flex items-center justify-center gap-1">
                <i data-lucide="send" class="w-4 h-4"></i> 發布題目
              </button>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-cream-700">
            <div class="text-xs text-cream-300">
              目前玩家已填答：<span id="host-submitted-count" class="font-bold text-accent-soft">0</span> 人
            </div>
            <div class="flex space-x-2">
              <button onclick="hostRevealAnswers()" class="bg-accent-lavender hover:bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-xs transition-colors flex items-center gap-1.5 shadow-sm">
                <i data-lucide="eye" class="w-4 h-4"></i> 全體 3D 翻牌開牌
              </button>
              <button id="btn-host-reset" onclick="hostResetGame()" class="bg-cream-700 hover:bg-cream-600 text-cream-200 font-medium px-3 py-2 rounded-xl text-xs transition-colors flex items-center gap-1">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> <span>重置狀態</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Current Room Status Header Bar -->
      <div class="bg-cream-50 border border-cream-200 rounded-3xl p-5 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center space-x-3 w-full md:w-auto">
          <div class="w-10 h-10 rounded-2xl bg-cream-200 flex items-center justify-center text-cream-700 shrink-0">
            <i data-lucide="user" class="w-5 h-5"></i>
          </div>
          <div class="overflow-hidden">
            <p class="text-xs text-cream-500">我的身份</p>
            <p id="display-player-name" class="font-rounded font-bold text-base text-cream-800 truncate">----</p>
          </div>
        </div>

        <!-- Room Pulse Status -->
        <div class="flex items-center space-x-3 bg-cream-100 px-4 py-2 rounded-2xl border border-cream-200 text-xs w-full md:w-auto justify-between md:justify-end">
          <div class="flex items-center space-x-2">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-ping"></span>
            <span id="status-text" class="font-semibold text-cream-700">準備中 (Waiting)</span>
          </div>
          <div class="text-cream-400">|</div>
          <div class="text-cream-600 font-medium">
            已答: <span id="player-answers-count" class="font-bold text-cream-800">0</span> 人
          </div>
          <div class="text-cream-400">|</div>
          <button onclick="manualRetryCloud()" id="connection-badge" class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-cream-200 text-cream-700 hover:opacity-80 transition-opacity cursor-pointer" title="點擊立即重新同步雲端">
            連線偵測中...
          </button>
        </div>
      </div>

      <!-- Question Box -->
      <div class="bg-cream-50 border border-cream-200 rounded-3xl p-6 md:p-8 shadow-md text-center relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 opacity-5 text-cream-800 pointer-events-none">
          <i data-lucide="help-circle" class="w-40 h-40"></i>
        </div>
        <span class="inline-block px-3 py-1 bg-cream-200 text-cream-700 text-xs font-bold rounded-full mb-3">CURRENT QUESTION</span>
        <h2 id="display-question" class="font-rounded font-bold text-xl md:text-2xl text-cream-800 leading-relaxed max-w-xl mx-auto">
          等待房主出題中... ☕️
        </h2>
      </div>

      <!-- STATE A: PLAYING (SUBMIT ANSWER FORM) -->
      <div id="section-answer-form" class="bg-cream-50 border border-cream-200 rounded-3xl p-6 shadow-md space-y-4">
        <div id="answer-input-container" class="space-y-4">
          <label class="block text-sm font-bold text-cream-800">寫下你的心電感應答案：</label>
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="input-player-answer" placeholder="請輸入答案 (例如：西瓜)" 
                   class="flex-1 px-4 py-3 rounded-2xl bg-cream-100 border border-cream-300 focus:outline-none focus:ring-2 focus:ring-accent-warm text-cream-800 font-medium placeholder-cream-400 transition-all">
            <button onclick="submitAnswer()" class="bg-accent-warm hover:bg-orange-600 text-white font-bold px-6 py-3 rounded-2xl shadow-md transition-all flex items-center justify-center space-x-1.5">
              <i data-lucide="check" class="w-4 h-4"></i>
              <span>送出答案</span>
            </button>
          </div>
          <p class="text-xs text-cream-500">※ 開牌前皆可修改答案重送哦！</p>
        </div>

        <!-- Submitted Confirmation Banner -->
        <div id="answer-submitted-banner" class="hidden bg-cream-200/60 border border-cream-300 rounded-2xl p-4 text-center space-y-2">
          <div class="inline-flex items-center justify-center w-8 h-8 bg-matcha/20 text-accent-matcha rounded-full mb-1">
            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
          </div>
          <p class="text-sm font-bold text-cream-800">答案已成功鎖定！</p>
          <p class="text-xs text-cream-600">你的回答：「<span id="my-submitted-answer" class="font-bold text-cream-800"></span>」</p>
          <button onclick="unlockAnswerEdit()" class="text-xs text-accent-warm underline font-medium hover:text-orange-700 pt-1">
            點此修改答案
          </button>
        </div>
      </div>

      <!-- STATE B: REVEALED (3D CARDS GRID) -->
      <div id="section-reveal-grid" class="hidden space-y-4">
        <div class="flex items-center justify-between px-1">
          <h3 class="font-rounded font-bold text-lg text-cream-800 flex items-center gap-2">
            <i data-lucide="layers" class="w-5 h-5 text-accent-warm"></i>
            默契揭曉 moment ✦
          </h3>
          <span class="text-xs text-cream-500">卡片自動翻轉揭示</span>
        </div>

        <!-- 3D Flip Cards Grid Dynamic Render Container -->
        <div id="cards-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- Dynamically populated card items -->
        </div>
      </div>

    </section>

  </main>

  <!-- Footer Section -->
  <footer class="w-full max-w-4xl mx-auto px-4 py-6 text-center text-xs text-cream-400 flex flex-col sm:flex-row items-center justify-between border-t border-cream-200/60 mt-8 gap-2">
    <div>雲端心電感應 Telepathy Game &copy; 2026</div>
    <div class="flex items-center space-x-4">
      <button onclick="toggleHostConsole()" class="hover:text-cream-700 transition-colors">房主模式</button>
      <span>•</span>
      <button onclick="goHome()" class="hover:text-cream-700 transition-colors">回首頁</button>
    </div>
  </footer>

  <!-- App Main Logic JavaScript -->
  <script>
    // System Constants
    const SHEET_NAME = 'TelepathyData';
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbykp3_TKMarWOuAoQXU-BwcT2tjHxoUot2Cjt7bkoaqyH8N-DfTjTNBUQIAlsYOZ13Esg/exec";

    // Application State Variables
    let currentRoom = '';
    let playerName = '';
    let isHost = false;
    let pollingTimer = null;
    let gameState = {
      status: 'setup', // setup, playing, revealed
      question: '',
      answers: {}
    };
    let previousStatus = '';
    let lastRenderedAnswersJson = '';
    let submittedMyAnswer = false;
    let resetConfirmTimeout = null;
    let isOfflineFallback = false;
    let localFallbackStore = {};

    // Initialization on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons();
      }

      // Check URL query parameter ?room=XXXX
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');
        if (roomParam) {
          document.getElementById('input-room-code').value = roomParam.toUpperCase();
        }
      } catch (e) {
        console.warn("無法讀取網址參數:", e);
      }

      // Support Enter key on inputs
      document.getElementById('input-player-name').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinGame();
      });
      document.getElementById('input-room-code').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinGame();
      });
      document.getElementById('input-player-answer').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitAnswer();
      });
      document.getElementById('host-question-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') hostSetQuestion();
      });
    });

    // Toast Notification Helper
    let toastTimer = null;
    function showToast(message, iconName = 'info') {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      const iconEl = document.getElementById('toast-icon');

      if (!toast || !msgEl) return;

      msgEl.textContent = message;
      if (iconEl && window.lucide) {
        iconEl.setAttribute('data-lucide', iconName);
        lucide.createIcons();
      }

      toast.classList.remove('-translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Generate Random 4-Digit Room Code
    function generateRandomRoom() {
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('input-room-code').value = randomCode;
      showToast(`已產生隨機房號：${randomCode}`, 'shuffle');
    }

    // Join or Create Room
    function joinGame() {
      const nameInput = document.getElementById('input-player-name').value.trim();
      let roomInput = document.getElementById('input-room-code').value.trim().toUpperCase();

      if (!nameInput) {
        showToast('請先輸入你的玩家暱稱喔！', 'alert-circle');
        document.getElementById('input-player-name').focus();
        return;
      }

      if (!roomInput) {
        roomInput = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('input-room-code').value = roomInput;
      }

      playerName = nameInput;
      currentRoom = roomInput;

      // Update Header & UI Info
      document.getElementById('display-player-name').textContent = playerName;
      document.getElementById('header-room-code').textContent = currentRoom;
      document.getElementById('header-room-info').classList.remove('hidden');

      // Switch Views
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('view-game').classList.remove('hidden');

      // Safely update URL query without breaking sandboxed iframe
      try {
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set('room', currentRoom);
        window.history.pushState({}, '', newUrl);
      } catch (e) {}

      showToast(`歡迎 ${playerName} 加入房間 ${currentRoom}！`, 'sparkles');

      // Start Polling Game State
      fetchGameState();
      clearInterval(pollingTimer);
      pollingTimer = setInterval(fetchGameState, 2500);
    }

    // Return to Lobby / Home
    function goHome() {
      clearInterval(pollingTimer);
      currentRoom = '';
      previousStatus = '';
      lastRenderedAnswersJson = '';
      submittedMyAnswer = false;

      document.getElementById('view-game').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      document.getElementById('header-room-info').classList.add('hidden');

      try {
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.delete('room');
        window.history.pushState({}, '', newUrl);
      } catch (e) {}
    }

    // Toggle Secret Host Control Console
    function toggleHostConsole() {
      if (!currentRoom) {
        showToast('請先輸入暱稱與房號進入房間，即可開啟房主控制台 👑', 'crown');
        return;
      }

      isHost = !isHost;
      const consoleEl = document.getElementById('host-console');
      const toggleBtn = document.getElementById('secret-host-toggle');

      if (isHost) {
        consoleEl.classList.remove('hidden');
        toggleBtn.classList.remove('bg-cream-200', 'text-cream-700');
        toggleBtn.classList.add('bg-cream-800', 'text-accent-warm');
        showToast('已開啟隱藏房主控制台 👑', 'crown');
      } else {
        consoleEl.classList.add('hidden');
        toggleBtn.classList.add('bg-cream-200', 'text-cream-700');
        toggleBtn.classList.remove('bg-cream-800', 'text-accent-warm');
        showToast('已隱藏房主控制台', 'eye-off');
      }
    }

    // Copy Shareable Room Link
    function copyShareLink() {
      if (!currentRoom) return;

      let shareUrl = '';
      try {
        const cleanHref = window.location.href.replace(/^blob:/, '');
        const urlObj = new URL(cleanHref);
        urlObj.searchParams.set('room', currentRoom);
        shareUrl = urlObj.toString();
      } catch (e) {
        shareUrl = `房間代碼：${currentRoom}`;
      }

      const tempInput = document.createElement('input');
      tempInput.value = shareUrl;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(`已複製房號連結 (${currentRoom})！快分享給好友吧`, 'check');
      } catch (err) {
        showToast(`房間代碼：${currentRoom}`, 'info');
      }
      document.body.removeChild(tempInput);
    }

    // Manual Reconnect Cloud
    function manualRetryCloud() {
      showToast('正在重新同步雲端資料...', 'refresh-cw');
      fetchGameState();
    }

    // API Interaction: Fetch Current Game State (GET)
    async function fetchGameState() {
      if (!currentRoom) return;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const url = `${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}`;
        const response = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          redirect: 'follow',
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const text = await response.text();
        const data = JSON.parse(text);
        
        localFallbackStore[currentRoom] = data;
        setConnectionMode(false);
        updateGameUI(data);
      } catch (err) {
        console.warn("GAS GET 連線暫時受限，使用本機暫存顯示:", err);
        setConnectionMode(true);
        if (!localFallbackStore[currentRoom]) {
          localFallbackStore[currentRoom] = { status: 'setup', question: '', answers: {} };
        }
        updateGameUI(localFallbackStore[currentRoom]);
      }
    }

    // Update Connection Badge
    function setConnectionMode(offline) {
      isOfflineFallback = offline;
      const badge = document.getElementById('connection-badge');
      if (!badge) return;
      if (offline) {
        badge.textContent = '本機備援 (點此重連)';
        badge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 cursor-pointer';
      } else {
        badge.textContent = '雲端已連線 ✦';
        badge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 cursor-pointer';
      }
    }

    // Local Fallback State Update
    function applyLocalFallbackAction(payload) {
      if (!localFallbackStore[currentRoom]) {
        localFallbackStore[currentRoom] = { status: 'setup', question: '', answers: {} };
      }
      const roomState = localFallbackStore[currentRoom];

      if (payload.action === 'reset') {
        roomState.status = 'setup';
        roomState.question = '';
        roomState.answers = {};
      } else if (payload.action === 'set_question') {
        roomState.status = 'playing';
        roomState.question = payload.question;
        roomState.answers = {};
      } else if (payload.action === 'submit_answer') {
        roomState.answers[payload.playerName] = payload.answer;
      } else if (payload.action === 'reveal') {
        roomState.status = 'revealed';
      }
      updateGameUI(roomState);
    }

    // Send Action Payload to GAS (POST)
    async function postGASAction(payload) {
      payload.room = currentRoom;
      applyLocalFallbackAction(payload);

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });
        setTimeout(fetchGameState, 1000);
      } catch (err) {
        console.warn("GAS POST 傳送異常:", err);
        setConnectionMode(true);
      }
    }

    // Render & Sync UI View State
    function updateGameUI(data) {
      gameState = data;
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');
      const questionEl = document.getElementById('display-question');
      const answersCountEl = document.getElementById('player-answers-count');
      const hostSubmittedCount = document.getElementById('host-submitted-count');

      const answersObj = data.answers || {};
      const answerCount = Object.keys(answersObj).length;

      answersCountEl.textContent = answerCount;
      if (hostSubmittedCount) hostSubmittedCount.textContent = answerCount;

      const isStatusChanged = previousStatus !== data.status;
      previousStatus = data.status;

      questionEl.textContent = data.question ? data.question : "等待房主出題中... ☕️";

      if (data.status === 'setup') {
        statusText.textContent = "準備中 (Setup)";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse";
        
        document.getElementById('section-answer-form').classList.remove('hidden');
        document.getElementById('section-reveal-grid').classList.add('hidden');
        
        if (isStatusChanged) {
          submittedMyAnswer = false;
          document.getElementById('input-player-answer').value = '';
          document.getElementById('answer-input-container').classList.remove('hidden');
          document.getElementById('answer-submitted-banner').classList.add('hidden');
        }

      } else if (data.status === 'playing') {
        statusText.textContent = "作答中 (Playing)";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-green-500 animate-ping";

        document.getElementById('section-answer-form').classList.remove('hidden');
        document.getElementById('section-reveal-grid').classList.add('hidden');

        if (answersObj[playerName] && !submittedMyAnswer) {
          submittedMyAnswer = true;
          document.getElementById('my-submitted-answer').textContent = answersObj[playerName];
          document.getElementById('answer-input-container').classList.add('hidden');
          document.getElementById('answer-submitted-banner').classList.remove('hidden');
        }

      } else if (data.status === 'revealed') {
        statusText.textContent = "揭曉開牌 (Revealed)";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-accent-lavender";

        document.getElementById('section-answer-form').classList.add('hidden');
        document.getElementById('section-reveal-grid').classList.remove('hidden');

        const currentAnswersJson = JSON.stringify(answersObj);
        if (isStatusChanged || currentAnswersJson !== lastRenderedAnswersJson) {
          lastRenderedAnswersJson = currentAnswersJson;
          renderFlipCards(answersObj);
        }
      }
    }

    // Submit Player Answer
    function submitAnswer() {
      const answerInput = document.getElementById('input-player-answer').value.trim();
      if (!answerInput) {
        showToast('答案不可為空白喔！', 'alert-circle');
        return;
      }

      submittedMyAnswer = true;
      document.getElementById('my-submitted-answer').textContent = answerInput;
      document.getElementById('answer-input-container').classList.add('hidden');
      document.getElementById('answer-submitted-banner').classList.remove('hidden');

      postGASAction({
        action: 'submit_answer',
        playerName: playerName,
        answer: answerInput
      });

      showToast('答案已成功送出！等待開牌 ✦', 'check');
    }

    // Allow Player to Unlock & Edit Answer
    function unlockAnswerEdit() {
      document.getElementById('answer-input-container').classList.remove('hidden');
      document.getElementById('answer-submitted-banner').classList.add('hidden');
      document.getElementById('input-player-answer').focus();
    }

    // Dynamic 3D Card Rendering & Flip Animation Trigger
    function renderFlipCards(answersObj) {
      const container = document.getElementById('cards-container');
      const players = Object.keys(answersObj);

      if (players.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-8 text-center text-cream-400 text-sm">
            目前無人作答卡片喔！
          </div>
        `;
        return;
      }

      const escapeHTML = (str) => String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));

      container.innerHTML = players.map((name, idx) => {
        const ans = answersObj[name];
        return `
          <div class="h-40 perspective-1000">
            <div id="card-inner-${idx}" class="card-inner shadow-md hover:shadow-lg rounded-2xl border border-cream-200">
              <!-- Front Face -->
              <div class="card-front p-4 font-rounded">
                <div class="w-8 h-8 rounded-full bg-cream-100/60 flex items-center justify-center text-cream-700 mb-2">
                  <i data-lucide="help-circle" class="w-4 h-4"></i>
                </div>
                <div class="font-bold text-sm truncate w-full px-2">${escapeHTML(name)}</div>
                <div class="text-[10px] text-cream-500 mt-1">準備揭曉</div>
              </div>
              <!-- Back Face -->
              <div class="card-back p-4 font-rounded">
                <span class="text-[10px] font-bold text-accent-warm tracking-wider uppercase truncate max-w-full">${escapeHTML(name)}</span>
                <p class="font-bold text-lg text-cream-800 my-auto break-all px-1 leading-snug">${escapeHTML(ans)}</p>
                <div class="w-full flex justify-end">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5 text-accent-soft"></i>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();

      setTimeout(() => {
        players.forEach((_, idx) => {
          const cardEl = document.getElementById(`card-inner-${idx}`);
          if (cardEl && cardEl.parentElement) {
            setTimeout(() => {
              cardEl.parentElement.classList.add('card-flipped');
            }, idx * 180);
          }
        });
      }, 100);
    }

    // --- HOST ACTIONS ---
    function hostSetQuestion() {
      const q = document.getElementById('host-question-input').value.trim();
      if (!q) {
        showToast('請輸入題目內容！', 'alert-circle');
        return;
      }
      lastRenderedAnswersJson = '';
      postGASAction({
        action: 'set_question',
        question: q
      });
      document.getElementById('host-question-input').value = '';
      showToast('已更新題目並切換為作答狀態！', 'send');
    }

    function hostRevealAnswers() {
      postGASAction({ action: 'reveal' });
      showToast('指令已發出：同步全體 3D 開牌！', 'eye');
    }

    function hostResetGame() {
      const btn = document.getElementById('btn-host-reset');
      const btnText = btn.querySelector('span');

      if (!btn.dataset.confirming) {
        btn.dataset.confirming = 'true';
        btn.classList.remove('bg-cream-700', 'hover:bg-cream-600');
        btn.classList.add('bg-red-500', 'hover:bg-red-600', 'text-white');
        btnText.textContent = '確定重置？';
        showToast('請再點一次「確定重置？」以清空資料', 'alert-triangle');

        resetConfirmTimeout = setTimeout(() => {
          resetResetButtonState();
        }, 3500);
      } else {
        clearTimeout(resetConfirmTimeout);
        resetResetButtonState();
        lastRenderedAnswersJson = '';
        postGASAction({ action: 'reset' });
        showToast('房間狀態已重置為初始階段', 'rotate-ccw');
      }
    }

    function resetResetButtonState() {
      const btn = document.getElementById('btn-host-reset');
      if (!btn) return;
      const btnText = btn.querySelector('span');
      delete btn.dataset.confirming;
      btn.classList.add('bg-cream-700', 'hover:bg-cream-600');
      btn.classList.remove('bg-red-500', 'hover:bg-red-600', 'text-white');
      btnText.textContent = '重置狀態';
    }
  </script>
</body>
</html>
